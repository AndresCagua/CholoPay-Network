openapi: 3.1.0
info:
  title: CholoNet Network API
  version: 0.1.0
  description: Simulated participant, CholoKey, transfer, and settlement coordination API.
servers:
  - url: http://localhost:8080
security:
  - serviceBearer: []
paths:
  /health/live:
    get:
      security: []
      responses:
        '200': {description: Process is alive}
  /health/ready:
    get:
      security: []
      responses:
        '200': {description: Dependencies are ready}
        '503': {description: Dependencies are unavailable}
  /internal/v1/operator/overview:
    get:
      summary: Read the aggregated simulated operator projection
      security:
        - serviceBearer: []
      responses:
        '200':
          description: Aggregated read-only simulated operator projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperatorOverview'}
        '401': {description: Authorization required}
        '503': {description: Projection unavailable; no source-derived values are returned}
  /internal/v1/directory/port:
    post:
      summary: Port a synthetic CholoKey between participants
      security:
        - serviceBearer: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PortRequest'}}}}
      responses:
        '202': {description: Port accepted}
        '400': {description: Missing contract metadata}
        '401': {description: Authorization required}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/participants:
    post:
      summary: Register a simulated participant
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Participant'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/keys/resolve:
    get:
      parameters: [{name: key, in: query, required: true, schema: {type: string}}]
      responses:
        '200': {description: Minimal destination reference}
        '404': {description: Not found or intentionally minimized}
        '429': {$ref: '#/components/responses/RateLimited'}
  /v1/transfers:
    post:
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferRequest'}}}}
      responses:
        '202': {description: Accepted for processing}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: Validation failed}
  /v1/transfers/{id}:
    get:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Transfer status, content: {application/json: {schema: {$ref: '#/components/schemas/Transfer'}}}}}
components:
  securitySchemes:
    serviceBearer: {type: http, scheme: bearer}
  schemas:
    PortRequest:
      type: object
      required: [schema_version, correlation_id, causation_id, requested_at, idempotency_key, new_key_id]
      properties:
        schema_version: {type: string}
        correlation_id: {type: string, format: uuid}
        causation_id: {type: string, format: uuid}
        trace_id: {type: string}
        requested_at: {type: string, format: date-time}
        idempotency_key: {type: string, minLength: 1}
        key_type: {type: string}
        key_value: {type: string}
        account_ref: {type: string}
        account_kind: {type: string, enum: [PERSONAL, BUSINESS]}
        from_network_id: {type: string, format: uuid}
        from_participant_id: {type: string, format: uuid}
        to_network_id: {type: string, format: uuid}
        to_participant_id: {type: string, format: uuid}
        new_key_id: {type: string, format: uuid}
    TransferRequest:
      type: object
      required: [amount_minor, currency, source_participant_id, destination_key]
      properties:
        amount_minor: {type: integer, minimum: 1, format: int64}
        currency: {type: string, const: USD}
        source_participant_id: {type: string, format: uuid}
        destination_key: {type: string}
        correlation_id: {type: string, format: uuid}
    OperatorOverview:
      type: object
      description: Aggregated participant-health and incident projection from CholoNet-owned read models only.
      required: [schema_version, source, last_synchronized_at, reconciliation_status, health, incidents]
      properties:
        schema_version: {type: string}
        source: {type: string, const: cholonet-network-read-model}
        last_synchronized_at: {type: string, format: date-time}
        reconciliation_status: {type: string, enum: [UNKNOWN, CLEAN, DIFFERENCES]}
        networks: {type: integer, minimum: 0, description: Legacy aggregate count retained for compatibility}
        participants: {type: integer, minimum: 0, description: Legacy aggregate count retained for compatibility}
        active_keys: {type: integer, minimum: 0, description: Legacy aggregate count retained for compatibility}
        suspended_keys: {type: integer, minimum: 0, description: Legacy aggregate count retained for compatibility}
        health: {$ref: '#/components/schemas/OperatorHealth'}
        incidents:
          type: array
          items: {$ref: '#/components/schemas/OperatorIncident'}
    OperatorHealth:
      type: object
      required: [networks_total, networks_active, networks_suspended, participants_total, participants_active, participants_suspended, active_keys, suspended_keys]
      properties:
        networks_total: {type: integer, minimum: 0}
        networks_active: {type: integer, minimum: 0}
        networks_suspended: {type: integer, minimum: 0}
        participants_total: {type: integer, minimum: 0}
        participants_active: {type: integer, minimum: 0}
        participants_suspended: {type: integer, minimum: 0}
        active_keys: {type: integer, minimum: 0}
        suspended_keys: {type: integer, minimum: 0}
    OperatorIncident:
      type: object
      required: [code, count, source]
      properties:
        code: {type: string}
        count: {type: integer, minimum: 1}
        source: {type: string}
    Transfer:
      allOf:
        - $ref: '#/components/schemas/TransferRequest'
        - type: object
          required: [id, state, created_at]
          properties:
            id: {type: string, format: uuid}
            state: {type: string, enum: [CREATED, VALIDATING, FUNDS_RESERVED, READY_FOR_SETTLEMENT, SETTLED, CREDIT_PENDING, COMPLETED, REJECTED, EXPIRED, UNKNOWN_PENDING_RECONCILIATION, MANUAL_REVIEW]}
            created_at: {type: string, format: date-time}
            settled_at: {type: string, format: date-time, nullable: true}
    Problem: {type: object, required: [type, title, status], properties: {type: {type: string, format: uri}, title: {type: string}, status: {type: integer}, detail: {type: string}, trace_id: {type: string}}}
  responses:
    Conflict: {description: Conflict, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    RateLimited: {description: Too many requests, headers: {Retry-After: {schema: {type: integer}}}}
