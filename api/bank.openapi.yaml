openapi: 3.1.0
info: {title: CholoPay Bank Core API, version: 0.2.0, description: "API bancaria de participante sintético; cada banco se despliega de forma independiente. Los errores conservan un código estable en error y un mensaje humano en español en message."}
servers: [{url: http://localhost:8081}]
security: [{bearerAuth: []}]
paths:
  /health/live: {get: {security: [], responses: {'200': {description: Activo}}}}
  /health/ready: {get: {security: [], responses: {'200': {description: Listo}, '503': {description: No está listo}}}}
  /v1/customers:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerCreate'}}}}
      responses:
        '201': {description: Cliente y token sintéticos creados, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerCreated'}}}}
        '401': {description: Autorización bancaria ausente o inválida, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Datos sintéticos inválidos, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/accounts:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Cuentas pertenecientes al cliente autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/AccountList'}}}}
        '401': {description: Token del cliente ausente o inválido, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/accounts/{accountId}/balance:
    get:
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: accountId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Balance sintético de la cuenta propia, content: {application/json: {schema: {$ref: '#/components/schemas/AccountBalance'}}}}
        '401': {description: Token del cliente ausente o inválido, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Cuenta no perteneciente al cliente autenticado}
  /v1/transfers/internal:
    post:
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferInput'}}}}
      responses: {'202': {description: Aceptado}, '409': {description: Conflicto de idempotencia}, '422': {description: Rechazado}}
  /v1/transfers/interbank:
    post:
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferInput'}}}}
      responses: {'202': {description: Aceptado; no es prueba de liquidación}, '409': {description: Conflicto}}
  /v1/participants/{participantId}/obligations/{obligationId}/payment-intents:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: participantId, required: true, schema: {type: string}}
        - {in: path, name: obligationId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentInput'}}}}
      responses:
        '201': {description: Estado sintético APPLIED, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '202': {description: Aplicación pendiente o requiere reconciliación, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '400': {description: Falta la clave de idempotencia, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Autenticación bancaria ausente o inválida, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Conflicto de idempotencia, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Participante, cuenta de origen u obligación inválidos, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Configuración interna incompleta, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '502': {description: Gateway no disponible o no autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/obligations/{obligationId}/payment-intents:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: obligationId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentInput'}}}}
      responses:
        '201': {description: Estado sintético APPLIED, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '202': {description: Aplicación pendiente o requiere reconciliación, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '400': {description: Falta la clave de idempotencia, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Autenticación bancaria ausente o inválida, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Conflicto de idempotencia, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Participante, cuenta de origen u obligación inválidos, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Configuración interna incompleta, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '502': {description: Gateway no disponible o no autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/keys:
    post: {responses: {'201': {description: Registro solicitado}, '409': {description: La clave ya está activa}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  schemas:
    CustomerCreate: {type: object, required: [synthetic_reference], properties: {synthetic_reference: {type: string, maxLength: 160}}}
    CustomerCreated: {type: object, required: [customer_id, synthetic_reference, access_token, accounts], properties: {customer_id: {type: string, format: uuid}, synthetic_reference: {type: string}, access_token: {type: string}, accounts: {type: array, items: {$ref: '#/components/schemas/Account'}}}
    AccountList: {type: object, required: [accounts], properties: {accounts: {type: array, items: {$ref: '#/components/schemas/Account'}}}}
    Account: {type: object, required: [account_id, currency, balance_minor, available_balance_minor], properties: {account_id: {type: string, format: uuid}, currency: {type: string, const: USD}, balance_minor: {type: integer, format: int64}, available_balance_minor: {type: integer, format: int64}}}
    AccountBalance: {$ref: '#/components/schemas/Account'}
    TransferInput: {type: object, required: [source_account_id, amount_minor, currency], properties: {source_account_id: {type: string, format: uuid}, destination_account_ref: {type: string}, amount_minor: {type: integer, format: int64, minimum: 1}, currency: {type: string, const: USD}, correlation_id: {type: string, format: uuid}}}
    ObligationPaymentInput: {type: object, required: [participant_id, source_account_id, biller, amount, currency], properties: {participant_id: {type: string}, participantId: {type: string}, source_account_id: {type: string, format: uuid}, sourceAccountId: {type: string, format: uuid, description: UUID sintético de cuenta; en electricidad sí respalda un débito local sintético}, biller: {type: string, enum: [utilities, transit]}, amount: {type: string}, currency: {type: string, enum: [USD, SYN]}, service: {type: string, enum: [electricity, water, internet, mobile, registration, traffic_fine]}, invoice_id: {type: string}, invoiceId: {type: string}}}
    ErrorResponse: {type: object, required: [error, message], properties: {error: {type: string, description: Código estable para máquinas}, message: {type: string, description: Mensaje humano en español}}}
    ObligationPaymentResult: {type: object, required: [status], properties: {payment_intent_id: {type: string, format: uuid}, obligation_id: {type: string}, amount: {type: string}, currency: {type: string}, status: {type: string, enum: [APPLIED, PENDING_APPLICATION, UNKNOWN_PENDING_RECONCILIATION]}, journal_id: {type: string, format: uuid}, settlement: {type: string, const: not_claimed}}}
