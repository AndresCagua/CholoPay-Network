openapi: 3.1.0
info: {title: CholoPay Bank Core API, version: 0.2.0, description: "API bancaria de participante sintético; cada banco se despliega de forma independiente. Los errores conservan un código estable en error y un mensaje humano en español en message."}
servers: [{url: http://localhost:8081}]
security: [{bearerAuth: []}]
paths:
  /health/live: {get: {security: [], responses: {'200': {description: Activo}}}}
  /health/ready: {get: {security: [], responses: {'200': {description: Listo}, '503': {description: No está listo}}}}
  /v1/customers:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerCreate'}}}}
      responses:
        '201': {description: Cliente y token sintéticos creados, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerCreated'}}}}
        '401': {description: Autorización bancaria ausente o inválida, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Datos sintéticos inválidos, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/accounts:
    get:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Cuentas pertenecientes al cliente autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/AccountList'}}}}
        '401': {description: Token del cliente ausente o inválido, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/accounts/{accountId}/balance:
    get:
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: accountId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Balance sintético de la cuenta propia, content: {application/json: {schema: {$ref: '#/components/schemas/AccountBalance'}}}}
        '401': {description: Token del cliente ausente o inválido, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: Cuenta no perteneciente al cliente autenticado}
  /v1/accounts/{accountId}/movements:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string, description: Opaque Base64URL cursor}}
      responses:
        '200': {description: Movimientos propios en orden created_at/id descendente, content: {application/json: {schema: {$ref: '#/components/schemas/MovementPage'}}}}
        '400': {description: Cursor o límite inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '401': {description: Token inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Cuenta inaccesible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/accounts/{accountId}/journals:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: accountId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string, description: Opaque Base64URL cursor}}
      responses:
        '200': {description: Journals propios en orden created_at/id descendente, content: {application/json: {schema: {$ref: '#/components/schemas/JournalPage'}}}}
        '400': {description: Cursor o límite inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '401': {description: Token inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Cuenta inaccesible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/transfers/internal:
    post:
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferInput'}}}}
      responses: {'202': {description: Aceptado}, '409': {description: Conflicto de idempotencia}, '422': {description: Rechazado}}
  /v1/transfers/interbank:
    post:
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransferInput'}}}}
      responses: {'202': {description: Aceptado; no es prueba de liquidación}, '409': {description: Conflicto}}
  /v1/participants/{participantId}:
    get:
      summary: Consultar la identidad sintética del participante configurado
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: participantId, required: true, schema: {type: string}}]
      responses:
        '200': {description: Identidad y metadatos sintéticos del banco, content: {application/json: {schema: {$ref: '#/components/schemas/Participant'}}}}
        '401': {description: Autorización bancaria ausente o inválida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Participante no disponible sin revelar si el identificador pertenece a otro banco, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '503': {description: Configuración bancaria incompleta, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/participants/{participantId}/obligations/{obligationId}/payment-intents:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: participantId, required: true, schema: {type: string}}
        - {in: path, name: obligationId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentInput'}}}}
      responses:
        '201': {description: Estado sintético APPLIED, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '202': {description: Aplicación pendiente o requiere reconciliación, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '400': {description: Falta la clave de idempotencia, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Autenticación bancaria ausente o inválida, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Conflicto de idempotencia, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Participante, cuenta de origen u obligación inválidos, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Configuración interna incompleta, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '502': {description: Gateway no disponible o no autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/obligations/{obligationId}/payment-intents:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: obligationId, required: true, schema: {type: string}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentInput'}}}}
      responses:
        '201': {description: Estado sintético APPLIED, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '202': {description: Aplicación pendiente o requiere reconciliación, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '400': {description: Falta la clave de idempotencia, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '401': {description: Autenticación bancaria ausente o inválida, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '409': {description: Conflicto de idempotencia, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '422': {description: Participante, cuenta de origen u obligación inválidos, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '503': {description: Configuración interna incompleta, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '502': {description: Gateway no disponible o no autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /v1/payment-intents/{paymentIntentId}:
    get:
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: paymentIntentId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Intención de pago propia, content: {application/json: {schema: {$ref: '#/components/schemas/ObligationPaymentResult'}}}}
        '401': {description: Token del cliente inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Intención inaccesible}
  /v1/payment-intents/{paymentIntentId}/refunds:
    post:
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: paymentIntentId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/RefundInput'}}}}
      responses:
        '201': {description: Reembolso completo sintético durable; no modifica el ledger, content: {application/json: {schema: {$ref: '#/components/schemas/RefundResult'}}}}
        '400': {description: Importe parcial o clave ausente, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '401': {description: Token del cliente inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Intención inaccesible}
        '409': {description: Reembolso no permitido o conflicto de idempotencia, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/keys:
    post:
      summary: Crear una CholoKey sintética para la cuenta del cliente autenticado
      security: [{bearerAuth: []}]
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CholoKeyCreate'}}}}
      responses:
        '201': {description: CholoKey sintética creada, content: {application/json: {schema: {$ref: '#/components/schemas/CholoKey'}}}}
        '400': {description: Solicitud de CholoKey inválida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '401': {description: Autorización del cliente inválida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '409': {description: CholoKey no disponible o conflicto de idempotencia, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '503': {description: Configuración bancaria no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/keys/{keyId}:
    get:
      summary: Consultar una CholoKey propia sin enumerar el directorio
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: keyId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: CholoKey propia, content: {application/json: {schema: {$ref: '#/components/schemas/CholoKey'}}}}
        '404': {description: Clave no disponible; no revela existencia ajena, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '503': {description: Directorio no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/keys/{keyId}/suspend:
    post:
      summary: Suspender una CholoKey propia
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: keyId, required: true, schema: {type: string, format: uuid}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1}}]
      responses:
        '202': {description: Suspensión aceptada}
        '400': {description: Falta la clave de idempotencia, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Clave no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '409': {description: Transición no permitida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/keys/{keyId}/block:
    post:
      summary: Bloquear una CholoKey propia
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: keyId, required: true, schema: {type: string, format: uuid}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1}}]
      responses:
        '202': {description: Bloqueo aceptado}
        '400': {description: Falta la clave de idempotencia, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Clave no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '409': {description: Transición no permitida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/keys/{keyId}/delete:
    post:
      summary: Dar de baja una CholoKey propia
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: keyId, required: true, schema: {type: string, format: uuid}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1}}]
      responses:
        '202': {description: Baja aceptada}
        '400': {description: Falta la clave de idempotencia, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Clave no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '409': {description: Transición no permitida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/keys/{keyId}/qr:
    get:
      summary: Obtener el QR estático sintético de una CholoKey propia
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: keyId, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: QR estático sintético, content: {application/json: {schema: {$ref: '#/components/schemas/QrResponse'}}}}
        '404': {description: Clave no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '409': {description: QR no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/keys/{keyId}/qr/dynamic:
    post:
      summary: Crear un QR dinámico sintético de una CholoKey propia
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: keyId, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DynamicQrCreate'}}}}
      responses:
        '201': {description: QR dinámico sintético creado, content: {application/json: {schema: {$ref: '#/components/schemas/QrResponse'}}}}
        '400': {description: QR dinámico inválido, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
        '404': {description: Clave no disponible, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
  /v1/qr/verify:
    post:
      summary: Verificar un QR sintético y consumir un QR dinámico una sola vez
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QrVerify'}}}}
      responses:
        '200': {description: QR aceptado, content: {application/json: {schema: {$ref: '#/components/schemas/QrVerification'}}}}
        '409': {description: QR inválido, expirado o ya utilizado, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  schemas:
    CustomerCreate: {type: object, required: [synthetic_reference], properties: {synthetic_reference: {type: string, maxLength: 160}}}
    Participant: {type: object, required: [participant_id, metadata], properties: {participant_id: {type: string}, metadata: {type: object, required: [environment, status], properties: {environment: {type: string, const: synthetic}, status: {type: string, const: ACTIVE}}}}}
    CustomerCreated:
      type: object
      required: [customer_id, synthetic_reference, access_token, accounts]
      properties:
        customer_id: {type: string, format: uuid}
        synthetic_reference: {type: string}
        access_token: {type: string}
        accounts: {type: array, items: {$ref: '#/components/schemas/Account'}}
    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts: {type: array, items: {$ref: '#/components/schemas/Account'}}
    Account: {type: object, required: [account_id, currency, balance_minor, available_balance_minor], properties: {account_id: {type: string, format: uuid}, currency: {type: string, const: USD}, balance_minor: {type: integer, format: int64}, available_balance_minor: {type: integer, format: int64}}}
    AccountBalance: {$ref: '#/components/schemas/Account'}
    TransferInput: {type: object, required: [source_account_id, amount_minor, currency], properties: {source_account_id: {type: string, format: uuid}, destination_account_ref: {type: string}, amount_minor: {type: integer, format: int64, minimum: 1}, currency: {type: string, const: USD}, correlation_id: {type: string, format: uuid}}}
    ObligationPaymentInput: {type: object, required: [participant_id, source_account_id, biller, amount, currency], properties: {participant_id: {type: string}, participantId: {type: string}, source_account_id: {type: string, format: uuid}, sourceAccountId: {type: string, format: uuid, description: UUID sintético de cuenta; en electricidad sí respalda un débito local sintético}, biller: {type: string, enum: [utilities, transit]}, amount: {type: string}, currency: {type: string, enum: [USD, SYN]}, service: {type: string, enum: [electricity, water, internet, mobile, registration, traffic_fine]}, invoice_id: {type: string}, invoiceId: {type: string}}}
    ErrorResponse: {type: object, required: [error, message], properties: {error: {type: string, description: Código estable para máquinas}, message: {type: string, description: Mensaje humano en español}}}
    ProblemDetails: {type: object, required: [type, title, status, detail, code], properties: {type: {type: string, format: uri}, title: {type: string}, status: {type: integer}, detail: {type: string}, code: {type: string}}}
    Movement: {type: object, required: [id, journal_id, account_id, amount_minor, direction, currency, created_at], properties: {id: {type: string, format: uuid}, journal_id: {type: string, format: uuid}, account_id: {type: string, format: uuid}, amount_minor: {type: integer, format: int64}, direction: {type: string, enum: [DEBIT, CREDIT]}, currency: {type: string, const: USD}, created_at: {type: string, format: date-time}}}
    MovementPage: {type: object, required: [data, next_cursor], properties: {data: {type: array, items: {$ref: '#/components/schemas/Movement'}}, next_cursor: {type: [string, 'null']}}}
    JournalEntry: {type: object, required: [account_id, amount_minor, direction, currency], properties: {account_id: {type: string, format: uuid}, amount_minor: {type: integer, format: int64}, direction: {type: string, enum: [DEBIT, CREDIT]}, currency: {type: string, const: USD}}}
    Journal: {type: object, required: [id, transaction_id, idempotency_key, correlation_id, entries, created_at], properties: {id: {type: string, format: uuid}, transaction_id: {type: string, format: uuid}, idempotency_key: {type: string}, correlation_id: {type: string, format: uuid}, entries: {type: array, items: {$ref: '#/components/schemas/JournalEntry'}}, created_at: {type: string, format: date-time}}}
    JournalPage: {type: object, required: [data, next_cursor], properties: {data: {type: array, items: {$ref: '#/components/schemas/Journal'}}, next_cursor: {type: [string, 'null']}}}
    ObligationPaymentResult: {type: object, required: [status], properties: {payment_intent_id: {type: string, format: uuid}, obligation_id: {type: string}, amount: {type: string}, currency: {type: string}, status: {type: string, enum: [APPLIED, PENDING_APPLICATION, UNKNOWN_PENDING_RECONCILIATION]}, journal_id: {type: string, format: uuid}, settlement: {type: string, const: not_claimed}}}
    RefundInput: {type: object, properties: {amount: {type: string, description: Debe coincidir con el importe total de la intención}}}
    RefundResult: {type: object, required: [refund_id, payment_intent_id, amount, currency, status, ledger_boundary], properties: {refund_id: {type: string, format: uuid}, payment_intent_id: {type: string, format: uuid}, amount: {type: string}, currency: {type: string, const: USD}, status: {type: string, const: SUCCEEDED}, ledger_boundary: {type: string, const: not_claimed}}}
    CholoKeyCreate: {type: object, required: [accountId, keyType, keyValue], properties: {accountId: {type: string, format: uuid}, keyType: {type: string, enum: [PHONE, EMAIL, DOCUMENT, RANDOM]}, keyValue: {type: string, minLength: 1}, accountKind: {type: string, enum: [PERSONAL, BUSINESS], default: PERSONAL}}}
    CholoKey: {type: object, required: [keyId, keyType, keyValue, accountId, accountKind, status, version], properties: {keyId: {type: string, format: uuid}, keyType: {type: string}, keyValue: {type: string}, accountId: {type: string, format: uuid}, accountKind: {type: string, enum: [PERSONAL, BUSINESS]}, status: {type: string, enum: [ACTIVE, SUSPENDED, BLOCKED, DELETED]}, version: {type: integer, format: int64}}}
    DynamicQrCreate: {type: object, required: [amountMinor, reference, expiresAt], properties: {amountMinor: {type: integer, format: int64, minimum: 1}, reference: {type: string, minLength: 1, maxLength: 160}, expiresAt: {type: string, format: date-time}}}
    QrResponse: {type: object, required: [payload, environment], properties: {payload: {type: string}, environment: {type: string, const: synthetic}}}
    QrVerify: {type: object, required: [payload], properties: {payload: {type: string}}}
    QrVerification: {type: object, required: [accepted, reason, keyId, amountMinor, reference, expiresAt], properties: {accepted: {type: boolean, const: true}, reason: {type: string}, keyId: {type: string, format: uuid, nullable: true}, amountMinor: {type: integer, format: int64}, reference: {type: string, nullable: true}, expiresAt: {type: string, format: date-time, nullable: true}}}
