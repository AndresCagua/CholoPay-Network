openapi: 3.1.0
info: {title: CholoPay Gateway API, version: 0.1.0, description: API sandbox para comercios; el gateway nunca escribe en un ledger.}
servers: [{url: http://localhost:8090}]
security: [{apiKey: []}]
paths:
  /health/live: {get: {security: [], responses: {'200': {description: Activo}}}}
  /v1/bill-payments:
    post:
      summary: Pago sintético de factura de electricidad del Banco Costa
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BillPaymentCreate'}}}}
      responses: {'201': {description: Aplicado por CholoServicios}, '202': {description: Facturador no disponible o aplicación pendiente}, '409': {description: El payload difiere para la clave}, '422': {description: Participante o factura no compatibles}}
  /v1/bill-payments/{id}:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Pago sintético actual de la factura}}
  /v1/bill-payments/{id}/apply:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      responses: {'201': {description: Aplicado}, '202': {description: Sigue no disponible}}
  /v1/payment-intents:
    post:
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentIntentCreate'}}}}
      responses: {'201': {description: Creado}, '409': {description: El payload difiere para la clave}}
  /v1/payment-intents/{id}:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Intent actual y estado derivado de la liquidación}}
  /v1/payment-intents/{id}/confirm:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      responses: {'200': {description: Confirmación sintética; la redirección del navegador no es prueba}, '409': {description: Estado inválido}}
  /v1/refunds:
    post:
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefundCreate'}}}}
      responses: {'201': {description: Reembolso sintético total}, '400': {description: Solicitud inválida}, '409': {description: El intent no tuvo éxito o hay conflictos de clave/reembolso}, '422': {description: Reembolso parcial o con moneda incompatible}}

  /v1/webhook-endpoints:
    post: {responses: {'201': {description: Endpoint registrado con secreto mostrado una sola vez}}}
components:
  securitySchemes: {apiKey: {type: apiKey, in: header, name: X-Api-Key}}
  schemas:
    BillPaymentCreate:
      type: object
      required: [participant_id, invoice_id, service, amount, currency]
      properties:
        participant_id: {type: string, const: BANCO_COSTA}
        invoice_id: {type: string, const: invoice-elec-2025-001}
        service: {type: string, const: electricity}
        amount: {type: string, const: '42.50'}
        currency: {type: string, const: USD}
    PaymentIntentCreate:
      type: object
      required: [amount_minor, currency, merchant_order_id]
      properties:
        amount_minor: {type: integer, format: int64, minimum: 1}
        currency: {type: string, const: USD}
        merchant_order_id: {type: string}
        description: {type: string}
    RefundCreate:
      type: object
      required: [payment_intent_id, amount_minor, currency]
      properties:
        payment_intent_id: {type: string}
        amount_minor: {type: integer, format: int64, minimum: 1, description: Debe ser igual al importe del intent exitoso}
        currency: {type: string, const: USD}
