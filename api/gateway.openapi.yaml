openapi: 3.1.0
info: {title: CholoPay Gateway API, version: 0.1.0, description: Sandbox merchant API; gateway never writes a ledger.}
servers: [{url: http://localhost:8090}]
security: [{apiKey: []}]
paths:
  /health/live: {get: {security: [], responses: {'200': {description: Alive}}}}
  /v1/bill-payments:
    post:
      summary: Banco Costa synthetic electricity bill payment
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BillPaymentCreate'}}}}
      responses: {'201': {description: Applied by CholoServicios}, '202': {description: Biller unavailable or application pending}, '409': {description: Payload differs for key}, '422': {description: Unsupported participant or bill}}
  /v1/bill-payments/{id}:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}]
      responses: {'200': {description: Current synthetic bill payment}}
  /v1/bill-payments/{id}/apply:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      responses: {'201': {description: Applied}, '202': {description: Still unavailable}}
  /v1/payment-intents:
    post:
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentIntentCreate'}}}}
      responses: {'201': {description: Created}, '409': {description: Payload differs for key}}
  /v1/payment-intents/{id}:
    get:
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Current intent and settlement-derived state}}
  /v1/payment-intents/{id}/confirm:
    post:
      parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      responses: {'200': {description: Synthetic confirmation; browser redirect is not proof}, '409': {description: Invalid state}}
  /v1/refunds:
    post:
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefundCreate'}}}}
      responses: {'201': {description: Full synthetic refund}, '400': {description: Invalid request}, '409': {description: Intent is not succeeded or key/refund conflicts}, '422': {description: Partial or mismatched currency refund}}

  /v1/webhook-endpoints:
    post: {responses: {'201': {description: Endpoint registered with secret shown once}}}
components:
  securitySchemes: {apiKey: {type: apiKey, in: header, name: X-Api-Key}}
  schemas:
    BillPaymentCreate:
      type: object
      required: [participant_id, invoice_id, service, amount, currency]
      properties:
        participant_id: {type: string, const: BANCO_COSTA}
        invoice_id: {type: string, const: invoice-elec-2025-001}
        service: {type: string, const: electricity}
        amount: {type: string, const: '42.50'}
        currency: {type: string, const: USD}
    PaymentIntentCreate:
      type: object
      required: [amount_minor, currency, merchant_order_id]
      properties:
        amount_minor: {type: integer, format: int64, minimum: 1}
        currency: {type: string, const: USD}
        merchant_order_id: {type: string}
        description: {type: string}
    RefundCreate:
      type: object
      required: [payment_intent_id, amount_minor, currency]
      properties:
        payment_intent_id: {type: string}
        amount_minor: {type: integer, format: int64, minimum: 1, description: Must equal the succeeded intent amount}
        currency: {type: string, const: USD}
