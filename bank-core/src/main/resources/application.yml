spring:
  application:
    name: cholopay-bank-core
  flyway:
    enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/cholopay_costa}
    username: ${DB_USER:cholopay}
    password: ${DB_PASSWORD:cholopay_local_only}
server:
  port: ${SERVER_PORT:8081}
cholopay:
  participant-id: ${PARTICIPANT_ID:COSTA}
  outbox:
    event-name: TRANSFER_REQUESTED
    schema-version: 1.0
    network-url: ${CHOLONET_URL:}
    hmac-secret: ${CHOLONET_HMAC_SECRET:}
    lease-duration: ${OUTBOX_LEASE_DURATION:30s}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    base-backoff: ${OUTBOX_BASE_BACKOFF:1s}
    max-backoff: ${OUTBOX_MAX_BACKOFF:1m}
    enabled: ${OUTBOX_ENABLED:false}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
    http-timeout: ${OUTBOX_HTTP_TIMEOUT:2s}
