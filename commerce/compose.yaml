name: ${COMPOSE_PROJECT_NAME:-cholopay-commerce}

services:
  commerce:
    build:
      context: .
      target: runtime
    environment:
      PORT: 8081
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp

  commerce-test:
    build:
      context: .
      target: test
    profiles: [test]
