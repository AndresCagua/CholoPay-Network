name: ${COMPOSE_PROJECT_NAME:-cholopay_phase0}

services:
  network-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      POSTGRES_DB: ${NETWORK_DB_NAME:-cholopay_network}
    volumes: [network-db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  costa-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      POSTGRES_DB: ${COSTA_DB_NAME:-cholopay_costa}
    volumes: [costa-db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  sierra-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      POSTGRES_DB: ${SIERRA_DB_NAME:-cholopay_sierra}
    volumes: [sierra-db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  oriente-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      POSTGRES_DB: ${ORIENTE_DB_NAME:-cholopay_oriente}
    volumes: [oriente-db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  redis:
    image: redis:8-alpine
    profiles: [cache]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}

  utilities:
    build:
      context: ../utilities
    expose: ["8080"]
    healthcheck: {test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/health/live >/dev/null && wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"], interval: 5s, timeout: 3s, retries: 10}
    networks: [internal_services, default]

  transit:
    build:
      context: ../transit
      target: runtime
    environment:
      PORT: 8082
      TRANSIT_EVENT_SECRET: ${INTERNAL_EVENT_SECRET:-local-test-only}
    expose: ["8082"]
    healthcheck: {test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8082/health/live >/dev/null && wget -qO- http://127.0.0.1:8082/health/ready >/dev/null"], interval: 5s, timeout: 3s, retries: 10}
    networks: [internal_services, default]

  gateway:
    build:
      context: ../gateway
    environment:
      PORT: 8090
      BILLER_URL: http://utilities:8080
      TRANSIT_URL: http://transit:8082
      INTERNAL_EVENT_SECRET: ${INTERNAL_EVENT_SECRET:-local-test-only}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-2}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    expose: ["8090"]
    healthcheck: {test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8090/health/live >/dev/null && wget -qO- http://127.0.0.1:8090/health/ready >/dev/null"], interval: 5s, timeout: 3s, retries: 10}
    depends_on:
      utilities: {condition: service_started}
      transit: {condition: service_started}
    networks: [internal_services, default]

  bank-core:
    build:
      context: ../bank-core
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://costa-db:5432/${COSTA_DB_NAME:-cholopay_costa}
      DB_USER: ${POSTGRES_USER:-cholopay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      PARTICIPANT_ID: BANCO_COSTA
      PARTICIPANT_UUID: 00000000-0000-4000-8000-000000000101
      NETWORK_ID: 00000000-0000-4000-8000-000000000201
      CHOLONET_DIRECTORY_URL: http://network:8080/internal/v1/directory
      DIRECTORY_PORT_TOKEN: ${DIRECTORY_PORT_TOKEN:-}
      DIRECTORY_PARTICIPANT_TOKEN: ${COSTA_DIRECTORY_PARTICIPANT_TOKEN:-costa-directory-participant-local-only}
      SERVER_PORT: 8080
      NETWORK_ADAPTER_SECRET: ${NETWORK_ADAPTER_SECRET:-local-test-only}
      GATEWAY_URL: http://gateway:8090
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-sk_sandbox_merchant_rw}
      BANK_API_TOKEN: ${BANK_API_TOKEN:-bank-local-test-only}
      BILLER_UTILITIES_CLEARING_ACCOUNT_ID: ${BILLER_UTILITIES_CLEARING_ACCOUNT_ID:-00000000-0000-4000-8000-000000000002}
      CHOLONET_URL: http://network:8080/internal/v1/inter-network/transfers
      CHOLONET_HMAC_SECRET: ${CHOLONET_HMAC_SECRET:-}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-false}
      OUTBOX_TRANSPORT: ${OUTBOX_TRANSPORT:-http}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-cholonet.inter-network.v1}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-bank-core-outbox}
    expose: ["8080"]
    healthcheck: {test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/health/live >/dev/null && wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"], interval: 5s, timeout: 3s, retries: 10}
    depends_on:
      costa-db: {condition: service_healthy}
      gateway: {condition: service_started}

  bank-core-sierra:
    build:
      context: ../bank-core
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://sierra-db:5432/${SIERRA_DB_NAME:-cholopay_sierra}
      DB_USER: ${POSTGRES_USER:-cholopay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      PARTICIPANT_ID: BANCO_SIERRA
      PARTICIPANT_UUID: 00000000-0000-4000-8000-000000000102
      NETWORK_ID: 00000000-0000-4000-8000-000000000202
      CHOLONET_DIRECTORY_URL: http://network:8080/internal/v1/directory
      DIRECTORY_PORT_TOKEN: ${DIRECTORY_PORT_TOKEN:-}
      DIRECTORY_PARTICIPANT_TOKEN: ${SIERRA_DIRECTORY_PARTICIPANT_TOKEN:-sierra-directory-participant-local-only}
      SERVER_PORT: 8080
      NETWORK_ADAPTER_SECRET: ${SIERRA_NETWORK_ADAPTER_SECRET:-sierra-local-test-only}
      GATEWAY_URL: http://gateway:8090
      GATEWAY_API_KEY: ${SIERRA_GATEWAY_API_KEY:-sk_sandbox_sierra_rw}
      BANK_API_TOKEN: ${SIERRA_BANK_API_TOKEN:-bank-sierra-local-test-only}
      BILLER_UTILITIES_CLEARING_ACCOUNT_ID: ${SIERRA_BILLER_UTILITIES_CLEARING_ACCOUNT_ID:-00000000-0000-4000-8000-000000000012}
      CHOLONET_URL: http://network:8080/internal/v1/inter-network/transfers
      CHOLONET_HMAC_SECRET: ${SIERRA_CHOLONET_HMAC_SECRET:-}
      OUTBOX_ENABLED: ${SIERRA_OUTBOX_ENABLED:-false}
    expose: ["8080"]
    healthcheck: {test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/health/live >/dev/null && wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"], interval: 5s, timeout: 3s, retries: 10}
    depends_on:
      sierra-db: {condition: service_healthy}
      gateway: {condition: service_started}

  bank-core-oriente:
    build:
      context: ../bank-core
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://oriente-db:5432/${ORIENTE_DB_NAME:-cholopay_oriente}
      DB_USER: ${POSTGRES_USER:-cholopay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      PARTICIPANT_ID: BANCO_ORIENTE
      PARTICIPANT_UUID: 00000000-0000-4000-8000-000000000103
      NETWORK_ID: 00000000-0000-4000-8000-000000000203
      CHOLONET_DIRECTORY_URL: http://network:8080/internal/v1/directory
      DIRECTORY_PORT_TOKEN: ${DIRECTORY_PORT_TOKEN:-}
      DIRECTORY_PARTICIPANT_TOKEN: ${ORIENTE_DIRECTORY_PARTICIPANT_TOKEN:-oriente-directory-participant-local-only}
      SERVER_PORT: 8080
      NETWORK_ADAPTER_SECRET: ${ORIENTE_NETWORK_ADAPTER_SECRET:-oriente-local-test-only}
      GATEWAY_URL: http://gateway:8090
      GATEWAY_API_KEY: ${ORIENTE_GATEWAY_API_KEY:-sk_sandbox_oriente_rw}
      BANK_API_TOKEN: ${ORIENTE_BANK_API_TOKEN:-bank-oriente-local-test-only}
      BILLER_UTILITIES_CLEARING_ACCOUNT_ID: ${ORIENTE_BILLER_UTILITIES_CLEARING_ACCOUNT_ID:-00000000-0000-4000-8000-000000000022}
      CHOLONET_URL: http://network:8080/internal/v1/inter-network/transfers
      CHOLONET_HMAC_SECRET: ${ORIENTE_CHOLONET_HMAC_SECRET:-}
      OUTBOX_ENABLED: ${ORIENTE_OUTBOX_ENABLED:-false}
    expose: ["8080"]
    healthcheck: {test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/health/live >/dev/null && wget -qO- http://127.0.0.1:8080/health/ready >/dev/null"], interval: 5s, timeout: 3s, retries: 10}
    depends_on:
      oriente-db: {condition: service_healthy}
      gateway: {condition: service_started}

  phase16-banks-test:
    image: python:3.13-alpine
    profiles: [phase16]
    environment:
      COSTA_BANK_API_TOKEN: ${BANK_API_TOKEN:-bank-local-test-only}
      SIERRA_BANK_API_TOKEN: ${SIERRA_BANK_API_TOKEN:-bank-sierra-local-test-only}
      ORIENTE_BANK_API_TOKEN: ${ORIENTE_BANK_API_TOKEN:-bank-oriente-local-test-only}
    volumes:
      - ./tests/phase16_three_banks.py:/tests/phase16_three_banks.py:ro
    command: ["python", "/tests/phase16_three_banks.py"]
    depends_on:
      bank-core: {condition: service_started}
      bank-core-sierra: {condition: service_started}
      bank-core-oriente: {condition: service_started}
    networks: [internal_services, default]

  phase18-seed:
    image: postgres:17-alpine
    profiles: [phase18, phase20]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
    command:
      - sh
      - -c
      - >-
        until psql -h network-db -U ${POSTGRES_USER:-cholopay} -d ${NETWORK_DB_NAME:-cholopay_network} -c "SELECT 1 FROM network_participant LIMIT 1" >/dev/null 2>&1; do sleep 1; done;
        psql -h network-db -U ${POSTGRES_USER:-cholopay} -d ${NETWORK_DB_NAME:-cholopay_network} -v ON_ERROR_STOP=1 -c "INSERT INTO payment_network(network_id,code,kind,status) VALUES ('00000000-0000-4000-8000-000000000201','network-costa','BANKING','ACTIVE'),('00000000-0000-4000-8000-000000000202','network-sierra','BANKING','ACTIVE'),('00000000-0000-4000-8000-000000000203','network-oriente','BANKING','ACTIVE') ON CONFLICT DO NOTHING; INSERT INTO network_participant(participant_id,network_id,code,status) VALUES ('00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000201','BANCO_COSTA','ACTIVE'),('00000000-0000-4000-8000-000000000102','00000000-0000-4000-8000-000000000202','BANCO_SIERRA','ACTIVE'),('00000000-0000-4000-8000-000000000103','00000000-0000-4000-8000-000000000203','BANCO_ORIENTE','ACTIVE') ON CONFLICT DO NOTHING; INSERT INTO settlement_account(participant_id,balance_minor,currency) VALUES ('00000000-0000-4000-8000-000000000101',1000000,'USD'),('00000000-0000-4000-8000-000000000102',0,'USD'),('00000000-0000-4000-8000-000000000103',0,'USD') ON CONFLICT DO NOTHING;"
    depends_on:
      network-db: {condition: service_healthy}
      network: {condition: service_started}

  phase18-e2e:
    image: python:3.13-alpine
    profiles: [phase18]
    environment:
      NETWORK_ADAPTER_SECRET: ${NETWORK_ADAPTER_SECRET:-local-test-only}
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
    volumes:
      - ./tests/phase18_interbank_e2e.py:/tests/phase18_interbank_e2e.py:ro
    command:
      - sh
      - -c
      - pip install --no-cache-dir 'psycopg[binary]' >/dev/null && python /tests/phase18_interbank_e2e.py
    depends_on:
      phase18-seed: {condition: service_completed_successfully}
      network: {condition: service_started}
      bank-core-sierra: {condition: service_started}
      bank-core-oriente: {condition: service_started}
    networks: [internal_services, default]

  phase20-e2e:
    image: python:3.13-alpine
    profiles: [phase20]
    environment:
      NETWORK_ADAPTER_SECRET: ${NETWORK_ADAPTER_SECRET:-local-test-only}
      OPERATOR_CONSOLE_TOKEN: ${OPERATOR_CONSOLE_TOKEN:?OPERATOR_CONSOLE_TOKEN must be set}
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      PHASE20_MODE: ${PHASE20_MODE:-prepare}
    volumes:
      - ./tests/phase20_receiver_outage.py:/tests/phase20_receiver_outage.py:ro
    command:
      - sh
      - -c
      - pip install --no-cache-dir 'psycopg[binary]' >/dev/null && python /tests/phase20_receiver_outage.py "$${PHASE20_MODE}"
    depends_on:
      phase18-seed: {condition: service_completed_successfully}
      network: {condition: service_started}
      bank-core-sierra: {condition: service_started}
    networks: [internal_services, default]

  obligations-e2e:
    image: python:3.13-alpine
    profiles: [acceptance]
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-sk_sandbox_merchant_rw}
      BANK_API_TOKEN: ${BANK_API_TOKEN:-bank-local-test-only}
    volumes:
      - ./tests/t7_obligations_e2e.py:/tests/t7_obligations_e2e.py:ro
    command: ["python", "/tests/t7_obligations_e2e.py"]
    depends_on:
      transit: {condition: service_started}
      utilities: {condition: service_started}
      gateway: {condition: service_started}
      bank-core: {condition: service_started}
    networks: [internal_services, default]

  bank-openapi-test:
    image: python:3.13-alpine
    profiles: [test]
    volumes:
      - ../api/bank.openapi.yaml:/contract/api/bank.openapi.yaml:ro
      - ../api/network.openapi.yaml:/contract/api/network.openapi.yaml:ro
      - ./tests/test_bank_openapi.py:/contract/tests/test_bank_openapi.py:ro
    working_dir: /contract
    command: ["sh", "-c", "pip install --no-cache-dir PyYAML >/dev/null && python /contract/tests/test_bank_openapi.py"]

  bank-core-test:
    build:
      context: ../bank-core
      target: test
    profiles: [test]
    environment:
      DB_URL: jdbc:postgresql://costa-db:5432/${COSTA_DB_NAME:-cholopay_costa}
      DB_USER: ${POSTGRES_USER:-cholopay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      PARTICIPANT_ID: BANCO_COSTA
      NETWORK_ADAPTER_SECRET: ${NETWORK_ADAPTER_SECRET:-local-test-only}
      GATEWAY_URL: http://gateway:8090
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-sk_sandbox_merchant_rw}
      BANK_API_TOKEN: ${BANK_API_TOKEN:-bank-local-test-only}
      BILLER_UTILITIES_CLEARING_ACCOUNT_ID: ${BILLER_UTILITIES_CLEARING_ACCOUNT_ID:-00000000-0000-4000-8000-000000000002}
      CHOLONET_URL: http://network:8080/internal/v1/inter-network/transfers
      CHOLONET_HMAC_SECRET: ${CHOLONET_HMAC_SECRET:-}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-false}
    depends_on:
      costa-db: {condition: service_healthy}
      gateway: {condition: service_started}
    command: ["mvn", "-q", "-Pintegration", "test"]

  network:
    build:
      context: ../network
      target: runtime
    environment:
      SERVER_PORT: 8080
      NETWORK_DB_URL: postgres://${POSTGRES_USER:-cholopay}:${POSTGRES_PASSWORD:-cholopay_local_only}@network-db:5432/${NETWORK_DB_NAME:-cholopay_network}?sslmode=disable
      DIRECTORY_PORT_TOKEN: ${DIRECTORY_PORT_TOKEN:-}
      DIRECTORY_PARTICIPANT_TOKENS: ${DIRECTORY_PARTICIPANT_TOKENS:-00000000-0000-4000-8000-000000000101=costa-directory-participant-local-only,00000000-0000-4000-8000-000000000102=sierra-directory-participant-local-only,00000000-0000-4000-8000-000000000103=oriente-directory-participant-local-only}
      CHOLONET_HMAC_SECRET: ${CHOLONET_HMAC_SECRET:-}
      NETWORK_ADAPTER_SECRET: ${NETWORK_ADAPTER_SECRET:-local-test-only}
      OPERATOR_CONSOLE_TOKEN: ${OPERATOR_CONSOLE_TOKEN:?OPERATOR_CONSOLE_TOKEN must be set}
      BANK_RECEIVER_CREDIT_URL: http://bank-core:8080/internal/v1/receiver-credits
      BANK_RECEIVER_ROUTES: ${BANK_RECEIVER_ROUTES:-00000000-0000-4000-8000-000000000101=http://bank-core:8080/internal/v1/receiver-credits|local-test-only,00000000-0000-4000-8000-000000000102=http://bank-core-sierra:8080/internal/v1/receiver-credits|sierra-local-test-only,00000000-0000-4000-8000-000000000103=http://bank-core-oriente:8080/internal/v1/receiver-credits|oriente-local-test-only}
      DELIVERY_LEASE_SECONDS: ${DELIVERY_LEASE_SECONDS:-60}
    expose: ["8080"]
    healthcheck: {test: [CMD, /busybox, wget, -qO-, http://127.0.0.1:8080/health/live], interval: 5s, timeout: 3s, retries: 10}
    depends_on:
      network-db: {condition: service_healthy}
    networks: [internal_services, default]

  p9-performance:
    build:
      context: ../chololab
    profiles: [p9]
    environment:
      BANK_URL: http://bank-core:8080
      BANK_API_TOKEN: ${BANK_API_TOKEN:-bank-local-test-only}
      REQUESTS: ${P9_REQUESTS:-20}
      CONCURRENCY: ${P9_CONCURRENCY:-4}
      LOGICAL_SEED: ${P9_LOGICAL_SEED:-p9-financial-read-v1}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes:
      - ./tests/p9_performance_acceptance.py:/tests/p9_performance_acceptance.py:ro
      - ../chololab/runner.py:/chololab/runner.py:ro
    command: ["python", "/tests/p9_performance_acceptance.py"]
    depends_on:
      bank-core: {condition: service_started}
    networks: [internal_services, default]

  p8-health:
    image: python:3.13-alpine
    profiles: [p8]
    environment:
      P8_MODE: ${P8_MODE:-healthy}
    volumes:
      - ./tests/p8_health_acceptance.py:/tests/p8_health_acceptance.py:ro
    command: ["python", "/tests/p8_health_acceptance.py"]
    networks: [internal_services, default]

  p5-rate-limit:
    image: python:3.13-alpine
    profiles: [p5]
    environment:
      GATEWAY_URL: http://gateway:8090
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-sk_sandbox_merchant_rw}
      READ_ONLY_API_KEY: ${READ_ONLY_API_KEY:-sk_sandbox_merchant_ro}
    volumes:
      - ./tests/p5_rate_limit_acceptance.py:/tests/p5_rate_limit_acceptance.py:ro
    command: ["python", "/tests/p5_rate_limit_acceptance.py"]
    depends_on:
      gateway: {condition: service_started}
    networks: [internal_services, default]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:mode=1777
    expose: ["9090"]
    depends_on:
      network: {condition: service_started}
      bank-core: {condition: service_started}
    networks: [internal_services, default]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-only-observability
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana:mode=1777
    expose: ["3000"]
    depends_on:
      prometheus: {condition: service_started}
    networks: [internal_services, default]

  p8-observability:
    image: python:3.13-alpine
    profiles: [observability]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
    volumes:
      - ./tests/p8_observability_acceptance.py:/tests/p8_observability_acceptance.py:ro
    command: ["python", "/tests/p8_observability_acceptance.py"]
    depends_on:
      prometheus: {condition: service_started}
      grafana: {condition: service_started}
    networks: [internal_services, default]

  phase20-kafka-order:
    image: python:3.13-alpine
    profiles: [events]
    volumes:
      - ./tests/phase20_kafka_order.py:/tests/phase20_kafka_order.py:ro
    command: ["python", "/tests/phase20_kafka_order.py"]
    depends_on:
      bank-core: {condition: service_started}
    networks: [internal_services, default]

  phase20-kafka-consumer:
    image: python:3.13-alpine
    profiles: [events]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-cholonet.inter-network.v1}
      CHOLONET_HMAC_SECRET: ${CHOLONET_HMAC_SECRET:?CHOLONET_HMAC_SECRET must be set}
      NETWORK_DB_URL: postgres://${POSTGRES_USER:-cholopay}:${POSTGRES_PASSWORD:-cholopay_local_only}@network-db:5432/${NETWORK_DB_NAME:-cholopay_network}
    volumes:
      - ./tests/phase20_kafka_consumer.py:/tests/phase20_kafka_consumer.py:ro
    command: ["sh", "-c", "pip install --no-cache-dir kafka-python psycopg[binary] >/dev/null && python /tests/phase20_kafka_consumer.py"]
    depends_on:
      kafka: {condition: service_started}
      network: {condition: service_started}
    networks: [internal_services, default]

  network-test:
    build:
      context: ../network
      target: test
    profiles: [network-test]
    environment:
      NETWORK_DB_URL: postgres://${POSTGRES_USER:-cholopay}:${POSTGRES_PASSWORD:-cholopay_local_only}@network-db:5432/${NETWORK_DB_NAME:-cholopay_network}?sslmode=disable
    depends_on:
      network-db: {condition: service_healthy}
    command: ["go", "test", "-p", "1", "./..."]

  kafka:
    image: apache/kafka:4.0.0
    profiles: [events]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

networks:
  internal_services:
    internal: true

volumes:
  network-db-data:
  costa-db-data:
  sierra-db-data:
  oriente-db-data:
  redis-data:
