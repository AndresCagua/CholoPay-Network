name: ${COMPOSE_PROJECT_NAME:-cholopay_phase0}

services:
  network-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      POSTGRES_DB: ${NETWORK_DB_NAME:-cholopay_network}
    volumes: [network-db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  costa-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      POSTGRES_DB: ${COSTA_DB_NAME:-cholopay_costa}
    volumes: [costa-db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  sierra-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      POSTGRES_DB: ${SIERRA_DB_NAME:-cholopay_sierra}
    volumes: [sierra-db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  oriente-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cholopay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      POSTGRES_DB: ${ORIENTE_DB_NAME:-cholopay_oriente}
    volumes: [oriente-db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}

  redis:
    image: redis:8-alpine
    profiles: [cache]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}

  bank-core:
    build:
      context: ../bank-core
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://costa-db:5432/${COSTA_DB_NAME:-cholopay_costa}
      DB_USER: ${POSTGRES_USER:-cholopay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      PARTICIPANT_ID: COSTA
      SERVER_PORT: 8080
      NETWORK_ADAPTER_SECRET: ${NETWORK_ADAPTER_SECRET:-local-test-only}
    expose: ["8080"]
    depends_on:
      costa-db: {condition: service_healthy}

  bank-core-test:
    build:
      context: ../bank-core
      target: test
    profiles: [test]
    environment:
      DB_URL: jdbc:postgresql://costa-db:5432/${COSTA_DB_NAME:-cholopay_costa}
      DB_USER: ${POSTGRES_USER:-cholopay}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-cholopay_local_only}
      PARTICIPANT_ID: COSTA
      NETWORK_ADAPTER_SECRET: ${NETWORK_ADAPTER_SECRET:-local-test-only}
    depends_on:
      costa-db: {condition: service_healthy}
    command: ["mvn", "-q", "-Pintegration", "test"]

  network:
    build:
      context: ../network
      target: runtime
    environment:
      SERVER_PORT: 8080
      NETWORK_DB_URL: postgres://${POSTGRES_USER:-cholopay}:${POSTGRES_PASSWORD:-cholopay_local_only}@network-db:5432/${NETWORK_DB_NAME:-cholopay_network}?sslmode=disable
    expose: ["8080"]
    depends_on:
      network-db: {condition: service_healthy}
    networks: [internal_services, default]

  network-test:
    build:
      context: ../network
      target: test
    profiles: [network-test]
    environment:
      NETWORK_DB_URL: postgres://${POSTGRES_USER:-cholopay}:${POSTGRES_PASSWORD:-cholopay_local_only}@network-db:5432/${NETWORK_DB_NAME:-cholopay_network}?sslmode=disable
    depends_on:
      network-db: {condition: service_healthy}
    command: ["go", "test", "-p", "1", "./..."]

  kafka:
    image: apache/kafka:4.0.0
    profiles: [events]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

networks:
  internal_services:
    internal: true

volumes:
  network-db-data:
  costa-db-data:
  sierra-db-data:
  oriente-db-data:
  redis-data:
